<div class="login-container">
  <h2>Iniciar Sesión</h2>
  <form (submit)="login()">
    <label for="usuario">Usuario:</label>
    <input
      type="text"
      id="usuario"
      [(ngModel)]="usuario"
      name="usuario"
      required
    />

    <label for="password">Contraseña:</label>
    <input
      type="password"
      id="password"
      [(ngModel)]="password"
      name="password"
      required
    />

    <button type="submit">Ingresar</button>
  </form>
</div>
