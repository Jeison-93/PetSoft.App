<mat-card class="mat-cardModal">
    <mat-card-title style="margin: 15px;">{{data.title}}</mat-card-title>
    <mat-card-content>
      <form [formGroup]="form">
        
        <!-- Tipo de Identificación -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tipo de Identificación</mat-label>
          <mat-select formControlName="documentType">
            <mat-option *ngFor="let item of documentTypeList" [value]="item.code">
              {{ item.description }}
            </mat-option>
          </mat-select>
        </mat-form-field>
  
        <!-- Número de Identificación -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Número de Identificación</mat-label>
          <input matInput type="text" formControlName="documentNumber" required>
          <mat-error *ngIf="form.get('documentNumber')?.invalid && form.get('documentNumber')?.touched">
            Este campo es obligatorio.
          </mat-error>
        </mat-form-field>
  
        <!-- Nombre -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre</mat-label>
          <input matInput type="text" formControlName="name">
        </mat-form-field>
  
        <!-- Apellido -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Apellido</mat-label>
          <input matInput type="text" formControlName="lastName">
        </mat-form-field>
  
        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
        </mat-form-field>
  
        <!-- Teléfono -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Teléfono</mat-label>
          <input matInput type="text" formControlName="phone">
        </mat-form-field>
  
        <!-- Dirección -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Dirección</mat-label>
          <input matInput type="text" formControlName="addresss">
        </mat-form-field>

        <!-- Botón de Guardar -->
        <button mat-raised-button color="primary" class="buttonModal" type="submit" [disabled]="form.invalid" (click)="Save()">Guardar</button>

      </form>
