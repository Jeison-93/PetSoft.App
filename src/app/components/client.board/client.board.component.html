<!-- ENCABEZADO -->
<div  class="position-relative p-2 ms-2">
    <h2>Clientes</h2> 
        <div class="col-md-12">
            <div class="button-container">
              <button mat-raised-button color="primary" class="btn btn-primary" (click)="addClient()">Crear Cliente</button>
            </div>
        </div>
      </div>

  <!-- DATA GRID -->
    <div class="position-relative p-3 ms-2">
    <div class="row">  
      <div class="col-md-12">
          <div>
   
              <table class="table  table-sm table-responsive table-bordered table-striped table-hover" style=" overflow: auto; height:300px;">
                  <thead>
                    <tr style="position: sticky; top: 0; background: #fff;text-align: center;">
                    <th  >Editar</th>
                    <th  >Cambiar Estado</th>
                    <th class="col-auto">Mascotas</th>
                    <th class="col-auto" style="min-width: 350px;">Nombre</th>
                    <th class="col-auto" style="min-width: 350px;">Identificación</th>
                    <th class="col-auto" style="min-width: 250px;">Email</th> 
                    <th class="col-auto" style="min-width: 150px;">Teléfono</th>
                    <th class="col-auto">Estado</th>
                   
                  </tr>
                  </thead>
                  <tbody>
                  <tr *ngFor="let item of paginatedData" style="width: 180px;">
                      <td  width="180px" style="text-align: center;">
                        <button type="button"  matTooltip="Editar" style="border: none; background: transparent;" (click)="editClient(item)">
                          <img src="assets/edit-24.png "/>
                        </button>
                      </td>
                      <td *ngIf="item.state == '1'" width="auto" style="text-align: center;">
                        <button type="button" style="border: none; background: transparent;" matTooltip="Inactivar"  (click)="changeState(item)">
                          <img src="assets/removeUser-24.png"/>
                        </button>
                    </td>
                    <td *ngIf="item.state == '0'" width="auto" style="text-align: center;">
                        <button type="button"  style="border: none; background: transparent;"   matTooltip="Activar" (click)="changeState(item)">
                        <img src="assets/addUser-24.png" />
                      </button>
                    </td>
                    <td width="auto" style="text-align: center;">
                        <button type="button"  style="border: none; background: transparent;"   matTooltip="Mascotas" (click)="petDetail(item)">
                        <img src="assets/pet-24.png" />
                      </button>
                    </td>
                      <td style="text-align: center;">{{item.name}} {{item.lastName}}</td>
                      <td style="text-align: center;">{{item.documentType}} {{item.documentNumber}}</td>
                      <td style="text-align: center;">{{item.email}}</td>
                      <td style="text-align: center;">{{item.phone}}</td>
                      <td style="text-align: center;">{{item.stateDescription}}</td>
                  </tr>
                  </tbody>
              </table>
              <div class="form-inline pull-right margin-bottom-basic" *ngIf="paginatedData.length > 0">
                <div class="form-group col-md-12 p-1">
                    <div class="col-md-12">
                      <label for="totalItems"><b>Total registros: {{dataSource.length}}</b></label>      
                    
                  </div>
                </div>
  
                  <div class="form-group items-per-page p-2">
                   
                      <label for="itemsOnPageSelect">Items por página:</label>
                      <select id="itemsOnPageSelect" class="form-control input-sm" [value]="itemsPerPage" [(ngModel)]="itemsPerPage" (ngModelChange)="onValueChange($event)">
                          <option>5</option>
                          <option>10</option>
                          <option>25</option>
                      </select>
                  </div>
                  <nav>
                    <ul class="pagination justify-content-center">
                      <li class="page-item" [class.disabled]="currentPage === 1">
                        <button class="page-link"  (click)="changePage(currentPage - 1)">Anterior</button>
                      </li>
                      <li class="page-item" *ngFor="let page of totalPages" [class.active]="currentPage === page">
                        <button class="page-link"  (click)="changePage(page)">{{ page }}</button>
                      </li>
                      <li class="page-item" [class.disabled]="currentPage === totalPages.length">
                        <button class="page-link"  (click)="changePage(currentPage + 1)">Siguiente</button>
                      </li>
                    </ul>
                  </nav>
                </div>
          </div>
      </div>
    </div>
      
  </div>
