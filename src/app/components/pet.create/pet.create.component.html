<mat-card style="min-width: 70%">
  <mat-card-title style="margin: 5%; text-align: center; font-weight: bold"
    >Crear Mascotas</mat-card-title
  >
  <mat-card-content>
    <form [formGroup]="petForm">
      <mat-form-field class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" required />
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Especie</mat-label>
        <mat-select formControlName="species">
          <mat-option *ngFor="let item of speciesList" [value]="item.code">
            {{ item.description }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Raza</mat-label>
        <input matInput formControlName="breed" required />
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Edad</mat-label>
        <input matInput type="number" formControlName="age" required />
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Peso (Kg)</mat-label>
        <input matInput type="number" formControlName="weight" required />
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        class="buttonModal"
        [disabled]="petForm.invalid"
        (click)="savePets()"
      >
        Guardar
      </button>
    </form>

    <table mat-table [dataSource]="pets" class="mat-elevation-z8">
      <!-- Acciones -->
      <ng-container matColumnDef="edit">
        <th
          mat-header-cell
          *matHeaderCellDef
          style="width: 10px; text-align: center"
        >
          Editar
        </th>
        <td mat-cell *matCellDef="let row">
          <button mat-button color="primary" (click)="editRow(row)">
            <img src="assets/edit-24.png " />
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="delete">
        <th
          mat-header-cell
          *matHeaderCellDef
          style="width: 10px; text-align: center"
        >
          Eliminar
        </th>
        <td mat-cell *matCellDef="let row">
          <button mat-button color="secondary" (click)="deleteRow(row)">
            <img src="assets/delete-24.png" />
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="speciesDescription">
        <th mat-header-cell *matHeaderCellDef>Especie</th>
        <td mat-cell *matCellDef="let row">{{ row.speciesDescription }}</td>
      </ng-container>

      <ng-container matColumnDef="breed">
        <th mat-header-cell *matHeaderCellDef>Raza</th>
        <td mat-cell *matCellDef="let pet">{{ pet.breed }}</td>
      </ng-container>

      <ng-container matColumnDef="age">
        <th mat-header-cell *matHeaderCellDef>Edad</th>
        <td mat-cell *matCellDef="let pet">{{ pet.age }} años</td>
      </ng-container>

      <ng-container matColumnDef="weight">
        <th mat-header-cell *matHeaderCellDef>Peso</th>
        <td mat-cell *matCellDef="let pet">{{ pet.weight }} kg</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
